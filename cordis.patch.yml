# dsh-anchored-subagent bundle patch
#
# Inserts the installer row. On boot, the plugin copies the packaged
# `dsh-anchored-subagent` agent preset into the user preset root
# (${DSH_HOME:-~/.dsh}/.agent-presets), so it appears in DSH's agent preset
# picker. Select that preset for a session; subagents automatically inherit it.
#
# Install with:
#
#   dsh plugin add github:GY-Bai/dsh-anchored-subagent
#
- insert:
    - id: dsh-anchored-subagent
      name: 'dsh-anchored-subagent'
      config:
        force: false
